{% extends "base.html" %}
{% block title %}Settings · nextwatch{% endblock %}
{% block main %}
<h1>Settings</h1>
{% if saved %}<p class="note">Saved.</p>{% endif %}
<form method="post" action="/settings" class="settings">
  <fieldset><legend>My streaming services (UK)</legend>
    {% for id, name, n in providers %}
      <label><input type="checkbox" name="providers" value="{{ id }}" {% if id in st.providers %}checked{% endif %}> {{ name }} <span class="muted">({{ n }})</span></label>
    {% else %}<p class="muted">No provider data yet.</p>{% endfor %}
  </fieldset>
  <label>Default type
    <select name="media_type">
      {% for v, l in (("both", "Movies and TV"), ("movie", "Movies"), ("tv", "TV")) %}<option value="{{ v }}" {% if st.media_type == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
    </select></label>
  <label>Relevance vs variety ({{ st.mmr_lambda }})
    <input type="range" name="mmr_lambda" min="0" max="1" step="0.05" value="{{ st.mmr_lambda }}"></label>
  <label>Prefer lesser-known titles ({{ st.popularity_penalty }})
    <input type="range" name="popularity_penalty" min="0" max="1" step="0.05" value="{{ st.popularity_penalty }}"></label>
  <button type="submit">Save</button>
</form>
<form method="post" action="/logout"><button type="submit">Log out</button></form>
{% endblock %}
