{% extends "base.html" %}
{% block title %}Log in · nextwatch{% endblock %}
{% block main %}
<h1>nextwatch</h1>
<form method="post" action="/login" class="filters">
  <input type="password" name="password" placeholder="Password" aria-label="Password" autofocus required>
  <button type="submit">Log in</button>
</form>
{% if error %}<p class="note">{{ error }}</p>{% endif %}
{% endblock %}
